apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 3306
          name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "{{ .Values.auth.rootPassword }}"
        volumeMounts:
        - name: initdb
          mountPath: /docker-entrypoint-initdb.d
        resources:
          {{ toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: initdb
        configMap:
          name: mysql-initdb
